name: Build kotoGba GBARunner3 V0.4

on:
  push:
    branches: [ main, kotogba-v0.4-package ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotogba-gbarunner3-v04-package
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    timeout-minutes: 30

    steps:
      - name: Checkout kotoGba build bundle
        uses: actions/checkout@v4

      - name: Validate FireRed JP Rev1 koto package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import zipfile

          package = Path("packages/BPRJ_01.koto")
          if not package.is_file():
              raise SystemExit("Missing packages/BPRJ_01.koto")
          if package.stat().st_size != 22364:
              raise SystemExit(f"Unexpected BPRJ_01.koto size: {package.stat().st_size}")

          required = {"manifest.json", "cards.json", "resources.json", "recognizers.json"}
          with zipfile.ZipFile(package) as archive:
              bad_member = archive.testzip()
              if bad_member is not None:
                  raise SystemExit(f"Corrupt member in BPRJ_01.koto: {bad_member}")
              members = set(archive.namelist())
              missing = required - members
              if missing:
                  raise SystemExit(f"Missing package members: {sorted(missing)}")
              cards = json.loads(archive.read("cards.json"))

          def card_count(value):
              if isinstance(value, list):
                  return len(value)
              if isinstance(value, dict):
                  for key in ("cards", "entries", "items"):
                      candidate = value.get(key)
                      if isinstance(candidate, list):
                          return len(candidate)
                  if value and all(isinstance(item, dict) for item in value.values()):
                      return len(value)
              return None

          count = card_count(cards)
          if count != 78:
              raise SystemExit(f"Expected 78 cards, detected {count!r}")

          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          report = (
              "package=packages/BPRJ_01.koto\n"
              f"bytes={package.stat().st_size}\n"
              f"sha256={digest}\n"
              f"cards={count}\n"
              "game_code=BPRJ\n"
              "revision=01\n"
              "status=PASS\n"
          )
          Path("PACKAGE_VALIDATION_V04.txt").write_text(report, encoding="utf-8")
          print(report, end="")
          PY

      - name: Fetch exact GBARunner3 source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Gericom/GBARunner3.git upstream
          git -C upstream checkout ecaa817815d9761745606592f04affe5ee9c3731
          git -C upstream submodule update --init --recursive
          test "$(git -C upstream rev-parse HEAD)" = "ecaa817815d9761745606592f04affe5ee9c3731"
          test "$(git -C upstream/code/libs/libtwl rev-parse HEAD)" = "e069645bed14a93e149e873e9273f04851e3a04e"

      - name: Build pinned GBARunner3 clean
        shell: bash
        run: |
          set -euo pipefail
          make -C upstream/code
          test -s upstream/code/bootstrap/GBARunner3.nds
          mkdir -p out
          cp upstream/code/bootstrap/GBARunner3.nds out/GBARunner3_ecaa817_clean.nds
          sha256sum out/GBARunner3_ecaa817_clean.nds > out/SHA256_CLEAN.txt

      - name: Prepare and verify kotoGba assets and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sd/_gba/kotogba/packages
          base64 -d assets/home.raw16.gz.b64 | gzip -dc > sd/_gba/kotogba/home.raw16
          echo "474f7ff8060b2590228562c119c5b0470f03a94f5aadfebcaa2a1bf27c26e5ce  sd/_gba/kotogba/home.raw16" | sha256sum -c -
          test "$(stat -c%s sd/_gba/kotogba/home.raw16)" = "98304"
          cp packages/BPRJ_01.koto sd/_gba/kotogba/packages/BPRJ_01.koto
          cmp packages/BPRJ_01.koto sd/_gba/kotogba/packages/BPRJ_01.koto

      - name: Clean upstream build products
        shell: bash
        run: |
          set -euo pipefail
          make -C upstream/code clean

      - name: Restore exact pinned source before patch
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream reset --hard ecaa817815d9761745606592f04affe5ee9c3731
          git -C upstream submodule update --init --recursive --checkout
          test "$(git -C upstream rev-parse HEAD)" = "ecaa817815d9761745606592f04affe5ee9c3731"

      - name: Apply hardware-approved V0.3 runtime for V0.4
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_kotogba_v03.py upstream
          grep -F 'gKotoGbaLauncherService.SelectRom' upstream/code/core/arm9/source/main.cpp
          grep -F 'gKotoGbaLauncherService.ResolvePackageForHeader(gRomHeader);' upstream/code/core/arm9/source/main.cpp
          grep -F 'gKotoGbaUiService.Initialize();' upstream/code/core/arm9/source/main.cpp
          grep -F 'MPU_REGION_1, MPU_ACCESS_PERMISSION_PRIV_READ_WRITE' upstream/code/core/arm9/source/main.cpp
          grep -F 'MPU_REGION_1, MPU_ACCESS_PERMISSION_NONE' upstream/code/core/arm9/source/main.cpp
          grep -F 'kotoGba V0: capture disabled; VRAM C belongs to SUB_BG.' upstream/code/core/arm9/source/Emulator/VBlankIrq.s
          grep -F 'GAME_TITLE     := kotoGba' upstream/code/bootstrap/Makefile
          test -f upstream/code/core/arm9/source/Application/KotoGbaLauncherService.cpp
          test -f upstream/code/core/arm9/source/Application/KotoGbaLauncherService.h

      - name: Build kotoGba GBARunner3 V0.4
        shell: bash
        run: |
          set -euo pipefail
          make -C upstream/code
          test -s upstream/code/bootstrap/GBARunner3.nds
          cp upstream/code/bootstrap/GBARunner3.nds out/kotoGba_GBARunner3_V0_4.nds
          mkdir -p out/_gba/kotogba/packages
          cp sd/_gba/kotogba/home.raw16 out/_gba/kotogba/home.raw16
          cp sd/_gba/kotogba/packages/BPRJ_01.koto out/_gba/kotogba/packages/BPRJ_01.koto
          cp PACKAGE_VALIDATION_V04.txt out/PACKAGE_VALIDATION_V04.txt
          sha256sum \
            out/kotoGba_GBARunner3_V0_4.nds \
            out/_gba/kotogba/home.raw16 \
            out/_gba/kotogba/packages/BPRJ_01.koto \
            > out/SHA256_KOTOGBA_V04.txt
          printf '%s\n' \
            'GBARunner3=ecaa817815d9761745606592f04affe5ee9c3731' \
            'libtwl=e069645bed14a93e149e873e9273f04851e3a04e' \
            'runtime=hardware-approved kotoGba V0.3 EWRAM execution fix' \
            'feature=V0.4 real FireRed JP Rev1 package bundled with 78 learning cards' \
            'package_path=/_gba/kotogba/packages/BPRJ_01.koto' \
            'rom_path=/_gba/kotogba/games/Pocket Monsters - FireRed (Japan) (Rev 1).gba' \
            'rom_included=no' \
            'container=devkitpro/devkitarm:20241104' \
            > out/BUILD_BASE_V04.txt

      - name: Save V0.4 source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/source/patch_files out/source/packages
          cp tools/apply_kotogba_v03.py out/source/
          cp -r patch_files/code out/source/patch_files/
          cp packages/BPRJ_01.koto out/source/packages/BPRJ_01.koto
          cp .github/workflows/build-kotogba.yml out/source/
          printf '%s\n' \
            'Canonical runtime package alias:' \
            '/_gba/kotogba/packages/<GAMECODE>_<REV_HEX>.koto' \
            'FireRed JP Rev1: /_gba/kotogba/packages/BPRJ_01.koto' \
            'The user-owned .gba ROM is intentionally not included.' \
            > out/source/PACKAGE_NAMING.txt
          sha256sum \
            out/source/apply_kotogba_v03.py \
            out/source/patch_files/code/core/arm9/source/Application/KotoGbaLauncherService.cpp \
            out/source/patch_files/code/core/arm9/source/Application/KotoGbaLauncherService.h \
            out/source/patch_files/code/core/arm9/source/Application/KotoGbaUiService.cpp \
            out/source/patch_files/code/core/arm9/source/Application/KotoGbaUiService.h \
            out/source/packages/BPRJ_01.koto \
            > out/source/SHA256_SOURCE.txt

      - name: Build storage-free V0.4 launcher probe for emulator only
        shell: bash
        run: |
          set -euo pipefail
          make -C upstream/code clean
          sed -i 's/-DARM9 #-DGBAR3_IRQ_YIELDING/-DARM9 -DKOTOGBA_LAUNCHER_PROBE #-DGBAR3_IRQ_YIELDING/' upstream/code/core/arm9/Makefile
          sed -i 's/-DARM9 -DLIBTWL_ARM9/-DARM9 -DLIBTWL_ARM9 -DKOTOGBA_LAUNCHER_PROBE/' upstream/code/bootstrap/arm9/Makefile
          grep -F -- '-DKOTOGBA_LAUNCHER_PROBE' upstream/code/core/arm9/Makefile
          grep -F -- '-DKOTOGBA_LAUNCHER_PROBE' upstream/code/bootstrap/arm9/Makefile
          make -C upstream/code
          test -s upstream/code/bootstrap/GBARunner3.nds
          cp upstream/code/bootstrap/GBARunner3.nds out/kotoGba_GBARunner3_V0_4_LAUNCHER_PROBE.nds
          sha256sum out/kotoGba_GBARunner3_V0_4_LAUNCHER_PROBE.nds > out/SHA256_LAUNCHER_PROBE_V04.txt

      - name: Verify distributable layout
        shell: bash
        run: |
          set -euo pipefail
          test -s out/kotoGba_GBARunner3_V0_4.nds
          test -s out/_gba/kotogba/home.raw16
          test -s out/_gba/kotogba/packages/BPRJ_01.koto
          cmp packages/BPRJ_01.koto out/_gba/kotogba/packages/BPRJ_01.koto
          grep -F 'cards=78' out/PACKAGE_VALIDATION_V04.txt
          grep -F 'status=PASS' out/PACKAGE_VALIDATION_V04.txt

      - name: Upload kotoGba V0.4 build
        uses: actions/upload-artifact@v4
        with:
          name: kotoGba_GBARunner3_V0_4
          path: out
          retention-days: 14
          if-no-files-found: error
