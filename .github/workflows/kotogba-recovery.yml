name: kotoGBA - recuperacion (no ROM)

on:
  push:
    branches: [main, kotogba-persistencia-20261025]
    paths: ['tools/recovery/**', 'tests/recovery/**', 'project/**', 'docs/RECUPERACION.md', 'AGENTS.md', 'CLAUDE.md', '.gitignore', '.github/workflows/kotogba-recovery.yml']
  pull_request:
    branches: [main]
    paths: ['tools/recovery/**', 'tests/recovery/**', 'project/**', 'docs/RECUPERACION.md', 'AGENTS.md', 'CLAUDE.md', '.gitignore', '.github/workflows/kotogba-recovery.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotogba-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery-tests:
    name: Pruebas de recuperacion y contrato
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Probar con datos sinteticos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 --version | tee evidence/python.txt
          python3 -m unittest discover -s tests/recovery -v 2>&1 | tee evidence/unit-tests.txt
      - name: Validar contrato y bloqueo de publicacion
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/recovery/checkpoint.py contract | tee evidence/contract.json
          set +e
          python3 tools/recovery/checkpoint.py release-gate > evidence/release-gate.txt 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          grep -F 'BLOQUEADO' evidence/release-gate.txt
          git diff --exit-code
      - name: Estado verificable
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/COMMIT.txt
          cp project/STATE.json evidence/STATE.json
          printf '%s\n' '## Infraestructura, NO una ROM nueva' 'Las pruebas usan datos sinteticos. B19/B11 todavia no estan migrados. No se ha validado el juego ni una consola.' >> "$GITHUB_STEP_SUMMARY"
          sha256sum evidence/* > checksums.txt
          mv checksums.txt evidence/SHA256SUMS.txt
      - name: Conservar informes incluso tras un fallo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 90
          if-no-files-found: error

  arm-toolchain:
    name: Compilador ARM - prueba sintetica, no B19
    runs-on: ubuntu-24.04
    container: devkitpro/devkitarm:20241104
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compilar un objeto sintetico para ARM9
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-arm
          /opt/devkitpro/devkitARM/bin/arm-none-eabi-gcc --version > evidence-arm/compiler.txt
          /opt/devkitpro/devkitARM/bin/arm-none-eabi-gcc -mcpu=arm946e-s -mthumb -Wall -Wextra -Werror -c tests/recovery/arm_smoke.c -o /tmp/kotogba-infrastructure-smoke.o
          /opt/devkitpro/devkitARM/bin/arm-none-eabi-nm /tmp/kotogba-infrastructure-smoke.o | tee evidence-arm/symbols.txt
          grep -F 'kotogba_infrastructure_smoke' evidence-arm/symbols.txt
          sha256sum /tmp/kotogba-infrastructure-smoke.o > evidence-arm/object.sha256
          printf '%s\n' 'scope=synthetic_compiler_smoke_only' 'B19_compiled=false' 'ROM_produced=false' > evidence-arm/SCOPE.txt
      - name: Conservar evidencia de compilador sin distribuir binarios
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arm-toolchain-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-arm/
          retention-days: 90
          if-no-files-found: error
