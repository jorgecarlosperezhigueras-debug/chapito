name: Persist validated kotoGba V0.4 package

on:
  push:
    branches: [kotogba-v0.4-package]
    paths:
      - .github/workflows/persist-v04-package.yml

permissions:
  actions: read
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout V0.4 branch
        uses: actions/checkout@v4
        with:
          ref: kotogba-v0.4-package
          fetch-depth: 0

      - name: Download validated V0.4 artifact
        uses: actions/download-artifact@v4
        with:
          name: kotoGba_GBARunner3_V0_4
          run-id: 37699575625
          github-token: ${{ github.token }}
          path: recovered

      - name: Persist normalized package and clean validator
        shell: bash
        run: |
          set -euo pipefail
          package="$(find recovered -type f -path '*/_gba/kotogba/packages/BPRJ_01.koto' -print -quit)"
          test -n "$package"
          test -s "$package"
          mkdir -p packages tools
          cp "$package" packages/BPRJ_01.koto

          cat > tools/validate_koto_v04.py <<'PY'
          #!/usr/bin/env python3
          """Validate the repository-local FireRed JP Rev.1 koto package."""

          from __future__ import annotations

          from pathlib import Path
          from typing import NoReturn
          import hashlib
          import json
          import re
          import shutil
          import zipfile

          SOURCE = Path("packages/BPRJ_01.koto")
          VALIDATED = Path("validated_packages/BPRJ_01.koto")
          REPORT = Path("PACKAGE_VALIDATION_V04.txt")
          REQUIRED_MEMBERS = {
              "manifest.json",
              "cards.json",
              "resources.json",
              "recognizers.json",
          }
          EXPECTED_CARD_IDS = {
              *(f"T{i:03d}" for i in range(1, 12)),
              *(f"I{i:03d}" for i in range(1, 12)),
              "H001M", "H001F", "H002M", "H002F", "H003", "H004",
              *(f"U{i:03d}" for i in range(1, 12)),
              *(f"P{i:03d}" for i in range(1, 9)),
              *(f"R{i:03d}" for i in range(1, 4)),
              *(f"L{i:03d}" for i in range(1, 9)),
              "L009C", "L009S", "L009B",
              *(f"L{i:03d}" for i in range(10, 17)),
              *(f"B{i:03d}" for i in range(1, 11)),
          }
          CARD_ID_PATTERN = re.compile(r"^[TIHUPRLB][0-9]{3}[A-Z]?$")


          def fail(message: str) -> NoReturn:
              raise SystemExit(message)


          def collect_card_ids(value: object, output: set[str]) -> None:
              if isinstance(value, str):
                  if CARD_ID_PATTERN.fullmatch(value):
                      output.add(value)
                  return
              if isinstance(value, dict):
                  for key, child in value.items():
                      if isinstance(key, str) and CARD_ID_PATTERN.fullmatch(key):
                          output.add(key)
                      collect_card_ids(child, output)
                  return
              if isinstance(value, list):
                  for child in value:
                      collect_card_ids(child, output)


          def main() -> None:
              if len(EXPECTED_CARD_IDS) != 78:
                  fail(f"Internal expected-card set is {len(EXPECTED_CARD_IDS)}, not 78")
              if not SOURCE.is_file() or SOURCE.stat().st_size == 0:
                  fail(f"Missing or empty package: {SOURCE}")

              decoded: dict[str, object] = {}
              try:
                  with zipfile.ZipFile(SOURCE) as archive:
                      bad_member = archive.testzip()
                      if bad_member is not None:
                          fail(f"Corrupt ZIP member: {bad_member}")
                      names = set(archive.namelist())
                      missing = REQUIRED_MEMBERS - names
                      if missing:
                          fail(f"Missing package members: {sorted(missing)}")
                      for name in REQUIRED_MEMBERS:
                          try:
                              decoded[name] = json.loads(archive.read(name).decode("utf-8"))
                          except (UnicodeDecodeError, json.JSONDecodeError) as exc:
                              fail(f"Invalid UTF-8 JSON in {name}: {exc}")
              except zipfile.BadZipFile as exc:
                  fail(f"Unreadable koto ZIP: {exc}")

              discovered_ids: set[str] = set()
              collect_card_ids(decoded["cards.json"], discovered_ids)
              matched = discovered_ids & EXPECTED_CARD_IDS
              missing_ids = sorted(EXPECTED_CARD_IDS - matched)
              if missing_ids:
                  fail(
                      f"Expected 78 Pueblo Paleta card IDs; found {len(matched)}. "
                      f"Missing: {missing_ids}"
                  )

              VALIDATED.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(SOURCE, VALIDATED)
              if SOURCE.read_bytes() != VALIDATED.read_bytes():
                  fail("Validated package copy differs from repository source")

              digest = hashlib.sha256(SOURCE.read_bytes()).hexdigest()
              unexpected_ids = sorted(discovered_ids - EXPECTED_CARD_IDS)
              report = (
                  f"source_package={SOURCE}\n"
                  f"source_bytes={SOURCE.stat().st_size}\n"
                  f"source_sha256={digest}\n"
                  f"validated_package={VALIDATED}\n"
                  f"validated_bytes={VALIDATED.stat().st_size}\n"
                  f"validated_sha256={digest}\n"
                  f"unexpected_card_ids={','.join(unexpected_ids) if unexpected_ids else 'none'}\n"
                  "cards=78\n"
                  "game_code=BPRJ\n"
                  "revision=01\n"
                  "json_payloads_preserved=yes\n"
                  "status=PASS\n"
              )
              REPORT.write_text(report, encoding="utf-8")
              print(report, end="")


          if __name__ == "__main__":
              main()
          PY

          chmod +x tools/validate_koto_v04.py
          python3 tools/validate_koto_v04.py
          grep -F 'cards=78' PACKAGE_VALIDATION_V04.txt
          grep -F 'status=PASS' PACKAGE_VALIDATION_V04.txt

          rm -rf recovered validated_packages PACKAGE_VALIDATION_V04.txt
          git rm .github/workflows/persist-v04-package.yml

      - name: Commit clean V0.4 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/BPRJ_01.koto tools/validate_koto_v04.py .github/workflows/persist-v04-package.yml
          git commit -m "Persist validated FireRed package and clean V0.4 checkpoint [skip ci]"
          git push origin HEAD:kotogba-v0.4-package
