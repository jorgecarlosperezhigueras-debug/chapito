name: Finalize reproducible kotoGba V0.4 checkpoint

on:
  push:
    branches: [kotogba-v0.4-package]
    paths:
      - .github/workflows/persist-v04-finalize.yml

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout V0.4 branch
        uses: actions/checkout@v4
        with:
          ref: kotogba-v0.4-package
          fetch-depth: 0

      - name: Download validated V0.4 artifact
        uses: actions/download-artifact@v4
        with:
          name: kotoGba_GBARunner3_V0_4
          run-id: 37699575625
          github-token: ${{ github.token }}
          path: recovered

      - name: Install and verify clean package checkpoint
        shell: bash
        run: |
          set -euo pipefail
          package="$(find recovered -type f -path '*/_gba/kotogba/packages/BPRJ_01.koto' -print -quit)"
          test -n "$package"
          test -s "$package"

          cp "$package" packages/BPRJ_01.koto
          cp tools/validate_koto_v04_clean.py tools/validate_koto_v04.py
          chmod +x tools/validate_koto_v04.py
          python3 tools/validate_koto_v04.py
          grep -F 'source_sha256=a7c725161f3f033d52b2e2e90becc3f295fc90e8bd8b48acb202323054219328' PACKAGE_VALIDATION_V04.txt
          grep -F 'cards=78' PACKAGE_VALIDATION_V04.txt
          grep -F 'status=PASS' PACKAGE_VALIDATION_V04.txt

          rm -rf recovered validated_packages PACKAGE_VALIDATION_V04.txt
          git rm tools/validate_koto_v04_clean.py
          git rm .github/workflows/persist-v04-package.yml
          git rm .github/workflows/persist-v04-finalize.yml

      - name: Commit reproducible V0.4 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist validated FireRed package and clean V0.4 checkpoint [skip ci]"
          git push origin HEAD:kotogba-v0.4-package
